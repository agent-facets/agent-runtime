# Stage 1 stores.
#
# No `ports:` anywhere, deliberately. Proving the measurement network has no
# route off the host is part of the result, so publishing one would remove the
# thing being demonstrated. Every network is `internal: true` and therefore has
# no gateway.
#
# Compose owns the STATEFUL services only. Worker containers are started by the
# driver with explicit `--name` so a fault can signal a known container: Compose
# one-off containers get generated names that `compose ps -q` will not list,
# which is how a kill lands on nothing and the run reports a false negative.

name: ${COMPOSE_PROJECT_NAME:-kpwm}

networks:
  lane-m:
    name: ${NET_LANE_M:-kpwm-lane-m}
    internal: true
  lane-n:
    name: ${NET_LANE_N:-kpwm-lane-n}
    internal: true

volumes:
  pg-m:
    name: ${VOL_PG_M:-kpwm-pg-m}
  vault-m:
    name: ${VOL_VAULT_M:-kpwm-vault-m}
  pg-n:
    name: ${VOL_PG_N:-kpwm-pg-n}
  neo4j-n:
    name: ${VOL_NEO4J_N:-kpwm-neo4j-n}
  sources-n:
    name: ${VOL_SOURCES_N:-kpwm-sources-n}
  coordination:
    name: ${VOL_COORDINATION:-kpwm-coordination}

services:
  # --- Lane M ---------------------------------------------------------------
  # Execution plane and the derived projection share one instance, matching the
  # architecture's existing split: Postgres is canonical for execution and hosts
  # an app-owned, rebuildable memory index. Canonical knowledge is the vault
  # volume, never this database.
  pg-m:
    profiles: ["lane-m"]
    image: pgvector/pgvector:pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    networks: [lane-m]
    volumes:
      - pg-m:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: spike
      POSTGRES_DB: kpwm
      # Defensible only because this network is gateway-less and unpublished.
      # The evidence must keep saying so rather than implying a hardened posture.
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d kpwm"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 3s
    restart: "no"

  # --- Lane N ---------------------------------------------------------------
  pg-n:
    profiles: ["lane-n"]
    image: pgvector/pgvector:pg17-bookworm@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    networks: [lane-n]
    volumes:
      - pg-n:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: spike
      POSTGRES_DB: kpwm
      POSTGRES_HOST_AUTH_METHOD: trust
      TZ: UTC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spike -d kpwm"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 3s
    restart: "no"

  neo4j-n:
    profiles: ["lane-n"]
    image: neo4j:2026.07.1-community-ubi10@sha256:4c470275ab23a8a330d302ca98d3d440cd4b09d71b3fa3c05144999e5d9b241d
    networks: [lane-n]
    volumes:
      - neo4j-n:/data
      - sources-n:/sources
    environment:
      # Auth is disabled rather than given a password that would then have to be
      # kept out of `docker inspect`, the driver's argv, and every evidence file.
      # Safe only because the network is internal and unpublished, and recorded
      # as an accepted limitation exactly like the Postgres trust setting.
      NEO4J_AUTH: none
      # Community reports usage data by default. The gateway-less network already
      # makes that impossible; disabling it explicitly means the evidence does not
      # rest on the network alone.
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_dbms_usage__report_enabled: "false"
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
      TZ: UTC
    healthcheck:
      # A Bolt-level query, not a port probe: the HTTP listener answers before
      # the database is able to serve Cypher.
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 'RETURN 1' || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s
    restart: "no"

  # --- Coordination ---------------------------------------------------------
  # A bare repository both lanes publish into, on its own volume. It is attached
  # to both lane networks because the coordination plane is deliberately shared
  # infrastructure; nothing about knowledge authority crosses it.
  coordination:
    profiles: ["lane-m", "lane-n"]
    image: alpine/git:v2.49.1@sha256:c0280cf9572316299b08544065d3bf35db65043d5e3963982ec50647d2746e26
    networks: [lane-m, lane-n]
    volumes:
      - coordination:/srv/coordination
    entrypoint: ["/bin/sh", "-c"]
    command: ["git init --bare --initial-branch=main /srv/coordination/feed.git && sleep infinity"]
    read_only: false
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
