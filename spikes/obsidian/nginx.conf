# MCP bridge — the whole nginx.conf, not a conf.d fragment.
#
# Mounted read-only over /etc/nginx/nginx.conf and started with `nginx -g`
# directly, bypassing the image's entrypoint templating. Nothing is generated
# at runtime, so the configuration that ships is the configuration that runs.
#
# This is a TRANSPORT bridge, not a policy layer. It moves bytes between the
# container network and the plugin's hardcoded loopback listener and does the
# minimum header hygiene required to get there. Allowlisting, scoping and
# limits belong to the runtime MCP broker, upstream of this.

worker_processes  1;
pid               /tmp/nginx.pid;
error_log         /dev/stderr  warn;

events {
    worker_connections  256;
}

http {
    # Unprivileged user + read-only root filesystem: every path nginx may
    # write to has to live on the /tmp tmpfs.
    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    # Every request carries a bearer token. Logging them is a credential leak
    # with a long half-life, and the runtime's own event log is the real
    # audit trail.
    access_log     off;
    server_tokens  off;

    default_type   application/octet-stream;

    server {
        listen       0.0.0.0:8080;
        server_name  _;

        location / {
            proxy_pass http://127.0.0.1:27200;

            # nginx 1.29.1 still defaults to HTTP/1.0 upstream (1.29.7 changed
            # the default). SSE and chunked bodies need 1.1, so this is not
            # optional here even though a newer nginx would not need the line.
            proxy_http_version 1.1;

            # The plugin rejects any Origin that is not loopback, and an empty
            # value makes nginx omit the header entirely rather than send a
            # blank one. Omitted is explicitly allowed: the plugin's own
            # isOriginAllowed() returns true for a missing Origin, which is
            # the non-browser client case this bridge is.
            proxy_set_header Origin "";

            # Hop-by-hop. Clearing it stops a client's Connection header from
            # being relayed upstream and keeps 1.1 keepalive intact.
            proxy_set_header Connection "";

            proxy_set_header Host "127.0.0.1:27200";

            # Everything else — Authorization, Accept, Content-Type,
            # MCP-Protocol-Version, Mcp-Method, Mcp-Name — passes through
            # untouched, which is the entire point of the bridge.

            # Streaming. Both directions unbuffered: with buffering on, nginx
            # would hold an SSE notification frame until the response
            # completed, which for a subscriptions/listen stream is never.
            proxy_buffering          off;
            proxy_request_buffering  off;
            proxy_cache              off;

            # Relay the plugin's own status codes and bodies verbatim. The
            # 404/405/400/413 answers are part of the MCP contract and must
            # not be replaced with nginx's error pages.
            proxy_intercept_errors  off;

            # POST is not idempotent. A silent retry against a vault-mutating
            # tool call is worse than a failed request.
            proxy_next_upstream  off;

            # Deliberately unlimited HERE so the spike observes the PLUGIN's
            # own 1 MiB cap rather than nginx's. A production bridge should
            # re-add a cap as defence in depth; see the spike report.
            client_max_body_size  0;

            proxy_connect_timeout  5s;
            # Long-lived by design: a subscriptions/listen stream stays open
            # with only occasional keepalive frames.
            proxy_read_timeout     1h;
            proxy_send_timeout     1h;
        }
    }
}
