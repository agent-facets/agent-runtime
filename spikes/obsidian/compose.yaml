# Headless Obsidian spike stack.
#
# Deliberately has no `ports:` mapping anywhere. The MCP listener is bound to
# the container's loopback by the plugin and is reachable only from inside the
# container's own network namespace — proving that is part of the spike.
#
# Volume NAMES are configurable; the container paths are fixed. The default
# vault volume is the one the runtime would use in production.
#
# Profiles:
#   (none)       the headless service only — what verify-headless.sh drives
#   bridge       adds the nginx loopback bridge sidecar
#   bridge-test  adds the two probe containers verify-bridge.sh drives

name: ${COMPOSE_PROJECT_NAME:-agent-runtime-obsidian-spike}

services:
  obsidian:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: ${OBSIDIAN_IMAGE:-agent-runtime/obsidian-spike:1.13.7-2.4.0}
    restart: "no"
    stop_grace_period: 30s
    # Chromium is unhappy with Docker's 64 MB default.
    shm_size: 512m
    environment:
      OBSIDIAN_VAULT_PATH: /vault
      OBSIDIAN_CONFIG_DIR: /home/obsidian/.config/obsidian
      OBSIDIAN_VAULT_ID: ${OBSIDIAN_VAULT_ID:-a9e1d4c30b7f6285}
      OBSIDIAN_MCP_PORT: "27200"
      OBSIDIAN_PLUGIN_ID: mcp-tools-istefox
      OBSIDIAN_STARTUP_TIMEOUT: ${OBSIDIAN_STARTUP_TIMEOUT:-180}
      OBSIDIAN_TOKEN_LABEL: agent-runtime-spike
      # Empty means "leave the plugin's tool profile alone" (the headless
      # default, `all`). The bridge run sets `core` so a tool is genuinely
      # inactive and activate_tool produces a real SSE notification.
      OBSIDIAN_TOOL_PROFILE: ${OBSIDIAN_TOOL_PROFILE:-}
    secrets:
      - obsidian_mcp_token
    volumes:
      - vault:/vault
      - profile:/home/obsidian/.config/obsidian
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # The loopback bridge.
  #
  # Shares the Obsidian container's network namespace, so `127.0.0.1:27200` in
  # this container IS the plugin's listener. It then serves 0.0.0.0:8080 in
  # that same namespace, which makes it reachable at the obsidian service's own
  # address from the ordinary Compose network.
  #
  # Holds no secret: the bearer token is the caller's to present, and this
  # container never needs to read one. `docker inspect` on it should show no
  # secret mount at all.
  # ---------------------------------------------------------------------------
  mcp-bridge:
    profiles: ["bridge"]
    image: nginxinc/nginx-unprivileged:1.29.1-alpine@sha256:27985295bdb22a1ef8f712863210bd5877c0f3006494a593e86b3fe0fa55467e
    restart: "no"
    # Bypasses the image's entrypoint templating entirely — nothing about this
    # container's configuration is generated at runtime.
    entrypoint: ["nginx", "-g", "daemon off;"]
    network_mode: "service:obsidian"
    depends_on:
      obsidian:
        condition: service_healthy
        restart: true
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # A GET reaches the plugin's own method check and comes back 405. That
      # proves nginx is up AND the upstream is answering; a 502 (upstream
      # down) fails the grep.
      test: ["CMD-SHELL", "wget -S -q -O /dev/null http://127.0.0.1:8080/mcp 2>&1 | grep -q 405"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # ---------------------------------------------------------------------------
  # Probe on the ORDINARY Compose network — stands in for the runtime.
  #
  # Has its own network namespace and its own loopback, so anything it can
  # reach, a normally-networked runtime service can reach too.
  # ---------------------------------------------------------------------------
  probe-network:
    profiles: ["bridge-test"]
    image: curlimages/curl:8.15.0@sha256:4026b29997dc7c823b51c164b71e2b51e0fd95cce4601f78202c513d97da2922
    restart: "no"
    entrypoint: ["tail", "-f", "/dev/null"]
    # Outside swarm, Compose bind-mounts a secret with the HOST file's owner
    # and mode; the `uid`/`gid`/`mode` options are swarm-only. The token is
    # 0600 owned by the invoking user, so a consumer has to run as that uid or
    # it simply cannot read it. The image's own uid 100 cannot.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    secrets:
      - obsidian_mcp_token
    volumes:
      - ./probe-curl.sh:/usr/local/bin/probe-curl:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  # ---------------------------------------------------------------------------
  # Probe INSIDE the Obsidian network namespace — the control.
  #
  # Establishes what a consumer that gives up its own network identity can
  # reach, which is the "put the runtime in Obsidian's namespace" option.
  # ---------------------------------------------------------------------------
  probe-shared:
    profiles: ["bridge-test"]
    image: curlimages/curl:8.15.0@sha256:4026b29997dc7c823b51c164b71e2b51e0fd95cce4601f78202c513d97da2922
    restart: "no"
    entrypoint: ["tail", "-f", "/dev/null"]
    network_mode: "service:obsidian"
    depends_on:
      obsidian:
        condition: service_healthy
        restart: true
    # Same secret-ownership constraint as probe-network above.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    secrets:
      - obsidian_mcp_token
    volumes:
      - ./probe-curl.sh:/usr/local/bin/probe-curl:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  obsidian_mcp_token:
    file: ${OBSIDIAN_MCP_TOKEN_FILE:?set OBSIDIAN_MCP_TOKEN_FILE to an absolute path holding the bearer token}

volumes:
  vault:
    name: ${OBSIDIAN_VAULT_VOLUME:-agent-runtime-obsidian-vault}
  profile:
    name: ${OBSIDIAN_PROFILE_VOLUME:-agent-runtime-obsidian-profile}

networks:
  internal:
    name: ${OBSIDIAN_NETWORK:-agent-runtime-obsidian-spike-net}
