# Offline smoke overrides: an inert namespace holder replaces the Tailscale daemon, so no tailnet
# login or control-plane traffic occurs, and every network is internal.
services:
  tailscale:
    entrypoint: ['sh', '-c', "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait $$!; done"]
    environment: !reset {}
    volumes: !reset []
    networks: !override
      - backend

  # Test-built synthetic MCP programs, read-only, beside (never inside) the image's own program directory.
  runtime:
    volumes:
      - type: bind
        source: ${AGENT_RUNTIME_FIXTURE_PROGRAMS:?set AGENT_RUNTIME_FIXTURE_PROGRAMS}
        target: /opt/agent-runtime/mcp-fixture
        read_only: true
        bind:
          create_host_path: false

networks:
  egress:
    internal: true
