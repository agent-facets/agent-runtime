[install]
exact = true

# The console's stylesheet is Tailwind, compiled by this plugin wherever Bun serves the console from source: the
# development console server. Builds pass the plugin to Bun.build themselves.
[serve.static]
plugins = ["bun-plugin-tailwind"]

[test]
# Bare `bun test` from the repository root runs only deterministic offline suites.
# Historical spikes reset real databases; integration, container and live suites
# have explicit launchers that provision isolated fixtures.
pathIgnorePatterns = [
  "spikes/**",
  "tmp/**",
  "openspec/**",
  "architecture/**",
  ".opencode/**",
  "**/dist/**",
  "**/.turbo/**",
  "tests/**",
  "**/*.integration.test.ts",
  "**/*.live.test.ts",
]
