version: 2.1

# One required status, `ci/circleci: check`: the complete non-live gate, `bun run check`. It runs on every branch,
# including stacked and merge-queue branches, except Graphite's temporary `graphite-base/*` branches. Branches in this
# repository share Turbo's remote cache through the `turbo-cache` context. Pull requests from forks (`pull/<n>`) run the
# same check without any context, so their code never sees cache credentials. No deployment, provider or production
# context is used.

jobs:
  check:
    machine:
      # Local Docker: the fixture suites publish loopback ports and bind-mount host directories.
      image: ubuntu-2404:2026.05.1
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-mise-{{ arch }}-{{ checksum "mise.toml" }}
      - run:
          # The facet CLI comes from its GitHub release; `bun run check` verifies its digest before using it.
          name: Install the pinned Bun and facet CLI with mise
          environment:
            MISE_ENV: ci
          command: |
            [ -x "$HOME/.local/bin/mise" ] || curl -fsSL https://mise.run | MISE_VERSION=v2026.3.8 sh
            "$HOME/.local/bin/mise" trust
            "$HOME/.local/bin/mise" install
            for tool in bun github:agent-facets/facets; do
              dir=$("$HOME/.local/bin/mise" where "$tool")
              [ -d "$dir/bin" ] && dir="$dir/bin"
              echo "export PATH=\"$dir:\$PATH\"" >> "$BASH_ENV"
            done
      - save_cache:
          key: v1-mise-{{ arch }}-{{ checksum "mise.toml" }}
          paths:
            - ~/.local/bin/mise
            - ~/.local/share/mise/installs
      - restore_cache:
          keys:
            - v1-bun-{{ arch }}-{{ checksum "bun.lock" }}
      - run:
          name: Install dependencies
          command: bun install --frozen-lockfile
      - save_cache:
          key: v1-bun-{{ arch }}-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - restore_cache:
          keys:
            - v1-playwright-{{ arch }}-{{ checksum "bun.lock" }}
      - run:
          name: Install the pinned headless browser
          command: |
            bun --bun node_modules/playwright/cli.js install-deps chromium-headless-shell
            bun run browser:install
      - save_cache:
          key: v1-playwright-{{ arch }}-{{ checksum "bun.lock" }}
          paths:
            - ~/.cache/ms-playwright
      - run:
          name: Check
          command: bun run check
          no_output_timeout: 30m

workflows:
  check:
    jobs:
      - check:
          context:
            - turbo-cache
          filters:
            branches:
              ignore:
                - /pull\/[0-9]+/
                - /graphite-base\/.*/
  check-fork:
    jobs:
      - check:
          filters:
            branches:
              only:
                - /pull\/[0-9]+/
